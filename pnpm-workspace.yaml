# pnpm workspace definition for the Chapfoody SaaS monorepo.
#
# Every application lives in apps/, every shared library in packages/.
# `legacy/` is deliberately NOT listed: the frozen Vite prototype keeps its own
# dependency tree and is excluded from the pipeline (see legacy/README.md).
packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install/postinstall scripts.
#
# pnpm ≥ 10 blocks build scripts by default and fails the install when one is
# ignored (ERR_PNPM_IGNORED_BUILDS). That default is a genuine security win — a
# transitive dependency cannot execute code at install time — so instead of
# disabling the check globally we allowlist, explicitly, only the packages that
# actually need to build a native binary:
#
#   esbuild              → binary used by tsx (API dev server) and Vitest
#   @tailwindcss/oxide   → Tailwind v4 native engine
#   sharp                → native image processing used by next/image
#   prisma / @prisma/*   → download the query engine binaries
#
# `allowBuilds` is the pnpm 12 spelling; it replaced the earlier
# `onlyBuiltDependencies` list. `pnpm config list` reports every package still
# awaiting a decision, which is the authoritative way to discover what is pending.
#
# Anything else that asks for a build script must be added here deliberately, with
# a comment explaining why. Never use `--dangerously-allow-all-builds`: an
# unexpected package requesting an install script is exactly the supply-chain
# signal this default is designed to raise.
allowBuilds:
  # Native engines that build or download a binary at install time.
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  prisma: true

  # Native helpers pulled in by the API toolchain.
  '@parcel/watcher': true # native file watching
  'unrs-resolver': true # native module resolver used by ESLint

  # Denied on purpose. Each of these works without its build script, so allowing it
  # would mean running install-time code we have no use for:
  '@scarf/scarf': false # install-time analytics, not a build requirement
  ssh2: false # only needed for remote Docker; the pure-JS path is used
  'cpu-features': false # optional accelerator for ssh2, unused here
  'msgpackr-extract': false # optional accelerator for BullMQ; JS fallback is used
  protobufjs: false # its postinstall is a no-op for our usage
