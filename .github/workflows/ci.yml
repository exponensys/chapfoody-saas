# ─────────────────────────────────────────────────────────────────────────────
# Chapfoody SaaS — continuous integration
#
# Pipeline (ImplementationPlan.md section 8):
#   install → lint → typecheck → test → build
#
# Milestone notes:
#   M0  this file proves the workspace pipeline is green on an empty tree.
#   M1  adds integration tests against an ephemeral Neon branch.
#   M4+ adds Playwright E2E for PRs touching dashboard/storefront surfaces.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous, still-running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 LTS is the recommended runtime (.nvmrc). The workspace engines range
  # is ">=24.0.0", which also covers the Node 25 used by some local machines.
  NODE_VERSION: '24'
  PNPM_VERSION: '12.6.0'

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # --frozen-lockfile also asserts that pnpm-lock.yaml is committed and in
      # sync with the manifests, so a stale lockfile fails here rather than in
      # production.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Coverage thresholds are declared in apps/api/jest.config.mjs and enforced
      # here, so a drop below them fails the pipeline rather than being noticed later.
      - name: Test with coverage
        run: pnpm test:coverage

      # The ERD is generated from prisma/models/*.prisma and committed, so this fails when
      # someone changes the schema without regenerating the diagrams. Cheap — it is a
      # text comparison, no browser, no rendering — which is what makes it worth enforcing
      # rather than merely documenting.
      - name: Check the ERD is current
        run: pnpm --filter @chapfoody/api db:erd:check

      - name: Build
        run: pnpm build

  integration:
    name: integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The API's integration specs need real services. They are skipped when the
    # INTEGRATION_* variables are absent, so this job is what actually exercises them.
    #
    # Service containers are used rather than a Neon branch: they need no secret, they
    # start in seconds, and M1 has no schema to migrate yet. The runbook documents
    # switching to an ephemeral Neon branch once migrations exist (M2).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chapfoody
          POSTGRES_PASSWORD: chapfoody
          POSTGRES_DB: chapfoody
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chapfoody"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (also generates the Prisma client)
        run: pnpm --filter @chapfoody/api build

      # Migrations run as the OWNER (the service container's superuser). `migrate deploy`
      # only applies committed migrations — it never generates one — which is what makes
      # it safe here and why `db push` is banned outside local development.
      - name: Apply migrations
        env:
          DIRECT_URL: postgresql://chapfoody:chapfoody@localhost:5432/chapfoody
        run: pnpm --filter @chapfoody/api exec prisma migrate deploy

      # Fails if a migration is missing, unapplied, or if the database drifted from the
      # schema. Catches the classic mistake of editing the schema without migrating.
      - name: Verify migration state
        env:
          DIRECT_URL: postgresql://chapfoody:chapfoody@localhost:5432/chapfoody
        run: pnpm --filter @chapfoody/api exec prisma migrate status

      # The application role exists so that row-level security actually applies: the
      # container's user is a superuser, and PostgreSQL exempts superusers from every
      # policy. The tenant isolation suite asserts this and refuses to run otherwise.
      - name: Create the least-privilege application role
        run: |
          PGPASSWORD=chapfoody psql -h localhost -U chapfoody -d chapfoody \
            -v app_role_password="'ci-app-password'" \
            -f apps/api/prisma/sql/app-role.sql

      - name: Seed the database
        env:
          DATABASE_URL: postgresql://chapfoody_app:ci-app-password@localhost:5432/chapfoody
        run: pnpm --filter @chapfoody/api exec prisma db seed

      - name: Run integration tests (as the application role)
        env:
          INTEGRATION_DATABASE_URL: postgresql://chapfoody_app:ci-app-password@localhost:5432/chapfoody
          INTEGRATION_REDIS_URL: redis://localhost:6379
        run: pnpm --filter @chapfoody/api test:integration

  security:
    name: dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately non-blocking in M0: a fresh advisory must never silently stop
    # deliveries. M14 turns this into a blocking gate once the dependency set is
    # stable and a triage process exists (plan section 7.3 rule 9).
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high
